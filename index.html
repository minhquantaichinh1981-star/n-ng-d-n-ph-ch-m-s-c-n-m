<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Ký Khóa Học - Nông Dân Phố</title>
  <style>
    :root { --primary: #2e7d32; --primary-hover: #1b5e20; --bg: #f4f6f8; }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); margin: 0; padding: 20px; color: #333; }
    .container { max-width: 550px; margin: auto; background: #fff; border-radius: 12px; padding: 28px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
    h1 { font-size: 20px; color: var(--primary); text-align: center; margin-bottom: 6px; text-transform: uppercase; line-height: 1.4; }
    .subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 24px; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
    .req { color: #d32f2f; }
    input[type="text"], input[type="tel"], input[type="email"] {
      width: 100%; padding: 12px 14px; border: 1.5px solid #dcdfe6; border-radius: 8px; font-size: 15px; outline: none; transition: border-color 0.2s;
    }
    input:focus { border-color: var(--primary); }
    .combo-card {
      border: 1.5px solid #e0e0e0; border-radius: 8px; padding: 12px 16px; margin-bottom: 10px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; transition: all 0.2s;
    }
    .combo-card:hover { border-color: var(--primary); background: #f9fbf9; }
    .combo-card.active { border-color: var(--primary); background: #e8f5e9; font-weight: 600; }
    .combo-card input { margin-right: 10px; }
    .price-tag { color: #c62828; font-weight: 700; }
    .btn-submit {
      width: 100%; background: var(--primary); color: #fff; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; margin-top: 10px;
    }
    .btn-submit:hover { background: var(--primary-hover); }
    .btn-submit:disabled { background: #a5d6a7; cursor: not-allowed; }
    
    /* Payment Screen */
    #paymentSection { display: none; text-align: center; }
    .qr-img { width: 100%; max-width: 320px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.1); margin: 15px auto; }
    .bank-info { background: #fafafa; border: 1px dashed #ccc; border-radius: 8px; padding: 14px; text-align: left; font-size: 14px; line-height: 1.8; margin-bottom: 18px; }
    .btn-paid { background: #0288d1; }
    .btn-paid:hover { background: #0277bd; }
    .status-msg { margin-top: 12px; font-size: 14px; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <!-- MÀN HÌNH 1: FORM ĐĂNG KÝ -->
  <div id="formSection">
    <h1>Nông Dân Phố</h1>
    <div class="subtitle">Tự Chủ Vườn Nấm Sạch Tại Nhà</div>

    <form id="regForm" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label>Chọn gói Combo thực hành: <span class="req">*</span></label>
        
        <label class="combo-card active" onclick="selectCombo(this, 'G1', 369000, 'Không lấy combo thực hành', false)">
          <div><input type="radio" name="combo" value="G1" checked> Không lấy combo thực hành</div>
          <span class="price-tag">369.000đ</span>
        </label>

        <label class="combo-card" onclick="selectCombo(this, 'G2', 439000, 'Combo meo giống và giá thể', true)">
          <div><input type="radio" name="combo" value="G2"> Combo meo giống và giá thể</div>
          <span class="price-tag">439.000đ</span>
        </label>

        <label class="combo-card" onclick="selectCombo(this, 'G3', 639000, 'Combo nấm linh chi nghiền bột 250gr (làm vang)', true)">
          <div><input type="radio" name="combo" value="G3"> Combo nấm linh chi bột 250g</div>
          <span class="price-tag">639.000đ</span>
        </label>

        <label class="combo-card" onclick="selectCombo(this, 'G4', 659000, 'Combo nấm linh chi nghiền bột 250gr và meo giống và giá thể', true)">
          <div><input type="radio" name="combo" value="G4"> Combo nấm linh chi bột + meo & giá thể</div>
          <span class="price-tag">659.000đ</span>
        </label>
      </div>

      <div class="form-group">
        <label>Họ và Tên: <span class="req">*</span></label>
        <input type="text" id="fullName" placeholder="Ví dụ: Trần Minh Mẫn" required>
      </div>

      <div class="form-group">
        <label>Số Điện Thoại: <span class="req">*</span></label>
        <input type="tel" id="phone" placeholder="Ví dụ: 0909099099" required pattern="[0-9]{9,11}">
      </div>

      <div class="form-group">
        <label>Địa Chỉ Email: <span class="req">*</span></label>
        <input type="email" id="email" placeholder="Để nhận link lớp học và Meet" required>
      </div>

      <div class="form-group" id="addressGroup" style="display: none;">
        <label>Địa Chỉ Nhận Mẫu Combo: <span class="req">*</span></label>
        <input type="text" id="address" placeholder="Số nhà, tên đường, phường/xã, quận/huyện, tỉnh/TP">
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">ĐĂNG KÝ VÀ THANH TOÁN</button>
    </form>
  </div>

  <!-- MÀN HÌNH 2: THANH TOÁN QR -->
  <div id="paymentSection">
    <h2 style="color: var(--primary); margin-top:0;">THÔNG TIN THANH TOÁN</h2>
    <p style="font-size: 14px; color: #555;">Quét mã QR dưới đây qua ứng dụng Ngân hàng để thanh toán nhanh:</p>
    
    <img id="qrImage" class="qr-img" src="" alt="Mã QR Chuyển Khoản">

    <div class="bank-info">
      <div>Ngân hàng: <strong>Techcombank (TCB)</strong></div>
      <div>Số tài khoản: <strong>19022423550011</strong></div>
      <div>Chủ tài khoản: <strong>HO HOANG HIEU</strong></div>
      <div>Số tiền: <strong id="payAmount" style="color: #c62828;"></strong></div>
      <div>Nội dung CK: <strong id="payCode" style="color: #2e7d32;"></strong></div>
    </div>

    <button class="btn-submit btn-paid" id="btnPaid" onclick="confirmPayment()">TÔI ĐÃ CHUYỂN KHOẢN THÀNH CÔNG</button>
    <div id="paidStatus" class="status-msg"></div>
  </div>
</div>

<script>
  // DÁN URL WEB APP APPS SCRIPT VÀO ĐÂY
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzvvc4iVVYRTMGPkArUCcSyMickzh_zdZzoV-SjtpmW_1c8CLfBYXhalarBdtQtVO1oMg/exec";

  let selectedCombo = {
    code: 'G1',
    amount: 369000,
    name: 'Không lấy combo thực hành',
    requireAddress: false
  };

  let currentOrder = null;

  // Lấy mã Ref từ URL (?ref=tt)
  const urlParams = new URLSearchParams(window.location.search);
  const refCode = urlParams.get('ref') || 'organic';

  function selectCombo(el, code, amount, name, reqAddr) {
    document.querySelectorAll('.combo-card').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    el.querySelector('input').checked = true;

    selectedCombo = { code, amount, name, requireAddress: reqAddr };
    
    const addrGroup = document.getElementById('addressGroup');
    const addrInput = document.getElementById('address');
    if (reqAddr) {
      addrGroup.style.display = 'block';
      addrInput.required = true;
    } else {
      addrGroup.style.display = 'none';
      addrInput.required = false;
      addrInput.value = '';
    }
  }

  async function handleRegister(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerText = "Đang tạo đơn & mã thanh toán...";

    const payload = {
      action: "REGISTER",
      fullName: document.getElementById('fullName').value.trim(),
      phone: document.getElementById('phone').value.trim(),
      email: document.getElementById('email').value.trim(),
      address: document.getElementById('address').value.trim(),
      comboCode: selectedCombo.code,
      comboName: selectedCombo.name,
      amount: selectedCombo.amount,
      refCode: refCode
    };

    try {
      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      if (data.success) {
        currentOrder = data;
        document.getElementById('formSection').style.display = 'none';
        document.getElementById('paymentSection').style.display = 'block';
        document.getElementById('qrImage').src = data.qrUrl;
        document.getElementById('payAmount').innerText = data.amount.toLocaleString('vi-VN') + ' VNĐ';
        document.getElementById('payCode').innerText = data.transferCode;
      } else {
        alert("Có lỗi: " + data.message);
        btn.disabled = false;
        btn.innerText = "ĐĂNG KÝ VÀ THANH TOÁN";
      }
    } catch (err) {
      alert("Lỗi kết nối máy chủ: " + err);
      btn.disabled = false;
      btn.innerText = "ĐĂNG KÝ VÀ THANH TOÁN";
    }
  }

  async function confirmPayment() {
    if (!currentOrder) return;
    const btn = document.getElementById('btnPaid');
    const msg = document.getElementById('paidStatus');
    btn.disabled = true;
    btn.innerText = "Đang ghi nhận...";

    try {
      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: "CONFIRM_PAID", orderId: currentOrder.orderId })
      });
      const data = await res.json();
      if (data.success) {
        msg.style.color = "#2e7d32";
        msg.innerHTML = "✓ Đã ghi nhận chuyển khoản! Ban quản trị sẽ kiểm tra và gửi email xác nhận cùng Link lớp học cho bạn sớm nhất.";
        btn.style.display = "none";
      } else {
        alert(data.message);
        btn.disabled = false;
        btn.innerText = "TÔI ĐÃ CHUYỂN KHOẢN THÀNH CÔNG";
      }
    } catch (e) {
      alert("Lỗi kết nối: " + e);
      btn.disabled = false;
    }
  }
</script>

</body>
</html>
